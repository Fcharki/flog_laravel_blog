services:
  - type: web
    name: flog-blog
    runtime: php
    rootDir: public
    plan: free
    healthCheckPath: /
    buildCommand: |
      composer install --no-dev --optimize-autoloader --no-interaction
      npm ci --no-audit --no-fund
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan event:cache
    preDeployCommand: |
      php artisan migrate --seed --force
      php artisan storage:link || true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: flog-blog
          envVarKey: RENDER_EXTERNAL_URL
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_DATABASE
        fromDatabase:
          name: flog-blog-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: flog-blog-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: flog-blog-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: flog-blog-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: flog-blog-db
          property: port
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: database
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: flog-blog-db
    plan: free
    databaseName: flog
    user: flog