name: Update CommonMark

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - run: composer update league/commonmark

      - uses: peter-evans/create-pull-request@v8
      
        with:
          branch: fix/update-commonmark
          title: "Fix CommonMark security vulnerability"
          commit-message: "Update league/commonmark"
          body: "Update league/commonmark to address the reported vulnerability."
